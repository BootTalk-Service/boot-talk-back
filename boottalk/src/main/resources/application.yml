spring:
  application:
    name: boottalk

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/boottalk_db
    username: user
    password: 1234
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 10000      # 10초 이상 안 쓰면 반환
      max-lifetime: 1800000    # 30분 이상 연결된 커넥션 제거
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      format-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  batch:
    jdbc:
      initialize-schema: never # 테이블이 만들어진 이후에넌 never 로 변경하는 것이 좋음
    job:
      enabled: false

  security:
    oauth2:
      registration:
        naver:
          client-id: "ri7TwT1zZMlrY3i2D8nO"
          client-secret: "heiQ7arFX7"

  jwt:
    secret: "vmfhaltmskdlstkfkdgodyroqkfwkdbalroqkfwkdbalaaaaaaaaaaaaaaaabbbbb"

  data:
    redis:
      host: 43.200.67.27
      port: 6379

  task:
    execution:
      pool:
        core-size: 5
        max-size: 5
        queue-capacity: 500
      thread-name-prefix: notification-


server:
  url: "http://43.200.67.27:4000"
spring:
  application:
    name: boottalk

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/boottalk_db
    username: user
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      format-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  batch:
    jdbc:
      initialize-schema: always # 테이블이 만들어진 이후에넌 never 로 변경하는 것이 좋음

